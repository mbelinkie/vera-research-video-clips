# DeepSeek attempt: label an issue `deepseek` (or `deepseek-pro`) and a
# DeepSeek-powered coding agent works on it here, on a throwaway runner.
# It pushes a deepseek/* branch and opens a DRAFT PR with notes for Codex.
# Each issue runs separately, so many issues can run at once.
# Docs: .github/deepseek/README.md
name: DeepSeek attempt

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
      model:
        description: flash or pro
        default: flash

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: deepseek-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  attempt:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event.label.name == 'deepseek' || github.event.label.name == 'deepseek-pro') &&
       github.event.sender.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      MODEL_CHOICE: ${{ (github.event.label.name == 'deepseek-pro' || inputs.model == 'pro') && 'pro' || 'flash' }}
      MAX_TURNS: "200"
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out main (no saved credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Mark the issue as running
        run: node .github/deepseek/job.mjs start

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Install project dependencies (best effort)
        continue-on-error: true
        run: bash .github/deepseek/setup.sh 2>&1 | tee "$RUNNER_TEMP/setup.log"

      - name: Build the task prompt from the issue
        run: node .github/deepseek/job.mjs prompt > "$RUNNER_TEMP/prompt.md"

      - name: Run the DeepSeek agent
        id: agent
        continue-on-error: true
        timeout-minutes: 80
        env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_MODEL: ${{ env.MODEL_CHOICE == 'pro' && 'deepseek-v4-pro[1m]' || 'deepseek-flash[1m]' }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ env.MODEL_CHOICE == 'pro' && 'deepseek-v4-pro[1m]' || 'deepseek-flash[1m]' }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ env.MODEL_CHOICE == 'pro' && 'deepseek-v4-pro[1m]' || 'deepseek-flash[1m]' }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-flash
          CLAUDE_CODE_SUBAGENT_MODEL: deepseek-flash
          CLAUDE_CODE_EFFORT_LEVEL: max
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "786432"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          DISABLE_AUTOUPDATER: "1"
          GH_TOKEN: ""
        run: |
          # Tolerate stray spaces, newlines or quotes pasted into the secret.
          ANTHROPIC_AUTH_TOKEN="$(printf %s "$ANTHROPIC_AUTH_TOKEN" | tr -d '[:space:]"'"'"'')"
          export ANTHROPIC_AUTH_TOKEN
          test -n "$ANTHROPIC_AUTH_TOKEN" || { echo "DEEPSEEK_API_KEY secret is missing" > "$RUNNER_TEMP/agent.err"; exit 1; }
          npm install -g --silent @anthropic-ai/claude-code@2.1.318
          # Prompt goes through stdin: a single argv entry is capped at 128 KB.
          claude -p \
            --max-turns "$MAX_TURNS" \
            --output-format json \
            --permission-mode bypassPermissions \
            --disallowedTools WebSearch WebFetch \
            < "$RUNNER_TEMP/prompt.md" > "$RUNNER_TEMP/agent.json" 2> "$RUNNER_TEMP/agent.err"

      - name: Push the branch and open a draft PR
        if: always()
        env:
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          PUSH_TOKEN: ${{ github.token }}
        run: node .github/deepseek/job.mjs finish

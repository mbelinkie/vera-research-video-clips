name: Test

# Runs the full check on every PR and on main. Free on public repositories.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Provide FFmpeg paths required by checkpoint integration tests
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          for tool in ffmpeg ffprobe; do
            path="$(command -v "$tool")"
            if [ "$path" != "/usr/local/bin/$tool" ]; then
              sudo ln -sfn "$path" "/usr/local/bin/$tool"
            fi
          done
          /usr/local/bin/ffmpeg -version | head -n 1
      - name: Format, typecheck, tests, build and migration checks
        run: npm run check
      - name: Install locked Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Workspace browser tests
        run: npm run test:e2e -- tests/e2e/workspace.spec.ts --project=chromium
        env:
          VITE_BROWSER_AUTH: "false"
          VITE_MANAGED_RESEARCH: "false"

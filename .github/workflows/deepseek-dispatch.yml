# Public, read-only validation of Research issue dispatch requests.
name: VERA DeepSeek dispatch

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    if: >-
      github.event.repository.full_name == 'mbelinkie/vera-research-video-clips' &&
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/deepseek dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    concurrency:
      group: vera-deepseek-dispatch
      queue: max
      cancel-in-progress: false
    steps:
      # HANDOFF: replace this STL-only placeholder with the immutable commit
      # that adds the exact two-repository allowlist, after that change lands.
      # This revision rejects Research requests and therefore fails closed.
      - name: Checkout pinned trusted Script-to-Timeline validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mbelinkie/vera-script-to-timeline
          ref: ec355268f6aba4dbf9fe253282d534f6452a37d3
          path: trusted-validator
          persist-credentials: false
      - name: Use pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Validate the current Research issue; never invoke the Mac adapter
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERA_DEEPSEEK_DISPATCH_ENABLED: ${{ vars.VERA_DEEPSEEK_DISPATCH_ENABLED }}
          VERA_DEEPSEEK_ALLOWED_ACTORS: ${{ vars.VERA_DEEPSEEK_ALLOWED_ACTORS }}
          VERA_DEEPSEEK_TASK_CAP_USD: "0.25"
        run: node trusted-validator/scripts/deepseek-dispatch.mjs
  verify-mock-fixture:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout the pull request without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Check baseline refusal and isolated synthetic replacement
        run: node --test tests/deepseek-mock-candidate.test.mjs

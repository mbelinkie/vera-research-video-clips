name: M6 Windows junction gate

on:
  push:
    branches:
      - codex/m6-windows-junction-gate
    paths:
      - ".github/workflows/m6-windows-junction-gate.yml"

permissions:
  contents: read

jobs:
  physical-junction-containment:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Record runner and toolchain
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber | Format-List
          node --version
          npm --version
          git rev-parse HEAD
      - name: Install locked dependencies
        run: npm ci
      - name: Run physical Windows package-junction containment test
        run: npm exec vitest -- run apps/local-agent/src/artifact-locators.test.ts --testNamePattern "rejects a physical Windows package junction" --reporter=verbose --no-color

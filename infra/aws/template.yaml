AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Parameterized production boundary for the Research Video Clip Tool. Existing
  network, DNS, certificate, container image, and alert destinations are supplied
  only at change-set creation time.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [development, production]
  ApplicationName:
    Type: String
    Default: research-video-clips
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,30}$"
  TranscriptBucketName:
    Type: String
    Description: Globally unique private transcript bucket name
  AllowedUploadOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:43112
    Description: Web origins allowed to use authorized transcript transfer URLs
  CloudApiRoleArn:
    Type: String
    Default: ""
    Description: Optional existing development runtime role granted project-object access
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC containing the supplied public and private subnets
  VpcDnsResolverCidr:
    Type: String
    Description: Exact /32 CIDR of the supplied VPC Route 53 Resolver address
    AllowedPattern: "^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}/32$"
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two existing public subnets in separate Availability Zones for the ALB
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two existing private subnets in separate Availability Zones for Fargate and RDS
  AcmCertificateArn:
    Type: String
    Description: Existing ACM certificate ARN in this region for the HTTPS listener
  HostedZoneId:
    Type: String
    Default: ""
    Description: Optional existing Route 53 hosted-zone ID for the API alias record
  ApiDomainName:
    Type: String
    Description: Fully qualified API domain covered by AcmCertificateArn; it may use external DNS when HostedZoneId is empty
  ApiContainerImage:
    Type: String
    Description: Immutable API container image URI; supply an approved ECR image digest at deployment
  ApiContainerPort:
    Type: Number
    Default: 3000
    MinValue: 1
    MaxValue: 65535
  ApiDesiredCount:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10
  ApiTaskCpu:
    Type: String
    Default: "512"
    AllowedValues: ["256", "512", "1024", "2048", "4096"]
  ApiTaskMemory:
    Type: String
    Default: "1024"
    AllowedValues:
      [
        "512",
        "1024",
        "2048",
        "3072",
        "4096",
        "5120",
        "6144",
        "7168",
        "8192",
        "16384",
        "30720",
      ]
  DatabaseName:
    Type: String
    Default: researchvideo
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,62}$"
  DatabaseMasterUsername:
    Type: String
    Default: researchadmin
    NoEcho: true
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,15}$"
  DatabaseRuntimeUsername:
    Type: String
    Default: researchapp
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,62}$"
    Description: Pre-provisioned application role with only schema migration and catalog privileges
  DatabaseRuntimePasswordSecretArn:
    Type: String
    Description: ARN of an approved Secrets Manager secret whose value is the runtime database password
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.medium
  DatabaseAllocatedStorageGiB:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 65536
  DatabaseBackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues:
      [
        1,
        3,
        5,
        7,
        14,
        30,
        60,
        90,
        120,
        150,
        180,
        365,
        400,
        545,
        731,
        1827,
        3653,
      ]
  AlarmTopicArn:
    Type: String
    Default: ""
    Description: Optional existing SNS topic ARN for operational alarm notifications
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique Cognito hosted-UI domain prefix
    AllowedPattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
  CognitoLogoutUrl:
    Type: String
    Default: research-video-clips://oauth/logout
    Description: Registered native-app logout URL

Conditions:
  IsProduction: !Equals [!Ref EnvironmentName, production]
  IsDevelopment: !Equals [!Ref EnvironmentName, development]
  HasCloudApiRole: !Not [!Equals [!Ref CloudApiRoleArn, ""]]
  HasDevelopmentCloudApiRole:
    !And [!Condition IsDevelopment, !Condition HasCloudApiRole]
  HasDnsRecord: !And
    - !Not [!Equals [!Ref HostedZoneId, ""]]
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, ""]]

Resources:
  TranscriptBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref TranscriptBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Ref AllowedUploadOrigins
            AllowedMethods: [GET, HEAD, PUT]
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag, x-amz-version-id, x-amz-checksum-sha256]
            MaxAge: 900
      LifecycleConfiguration:
        Rules:
          - Id: AbortAbandonedMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: ExpireDisposableStagingVersions
            Status: Enabled
            Prefix: staging/
            ExpirationInDays: 7
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      Tags:
        - Key: application
          Value: !Ref ApplicationName
        - Key: environment
          Value: !Ref EnvironmentName

  TranscriptBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TranscriptBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              [!GetAtt TranscriptBucket.Arn, !Sub "${TranscriptBucket.Arn}/*"]
            Condition:
              Bool:
                aws:SecureTransport: false
          - !If
            - HasDevelopmentCloudApiRole
            - Sid: AllowDevelopmentCloudApiProjectListing
              Effect: Allow
              Principal: { AWS: !Ref CloudApiRoleArn }
              Action: s3:ListBucket
              Resource: !GetAtt TranscriptBucket.Arn
              Condition:
                StringLike:
                  s3:prefix: [projects/*, staging/*]
            - !Ref AWS::NoValue
          - !If
            - HasDevelopmentCloudApiRole
            - Sid: AllowDevelopmentCloudApiProjectObjects
              Effect: Allow
              Principal: { AWS: !Ref CloudApiRoleArn }
              Action: ["s3:GetObject", "s3:GetObjectVersion", "s3:PutObject"]
              Resource:
                [
                  !Sub "${TranscriptBucket.Arn}/projects/*",
                  !Sub "${TranscriptBucket.Arn}/staging/*",
                ]
            - !Ref AWS::NoValue
          - !If
            - HasDevelopmentCloudApiRole
            - Sid: AllowDevelopmentCloudApiStagingCleanup
              Effect: Allow
              Principal: { AWS: !Ref CloudApiRoleArn }
              Action: ["s3:DeleteObject", "s3:DeleteObjectVersion"]
              Resource: !Sub "${TranscriptBucket.Arn}/staging/*"
            - !Ref AWS::NoValue

  JobDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ApplicationName}-${EnvironmentName}-jobs-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      RedriveAllowPolicy:
        redrivePermission: byQueue
        sourceQueueArns:
          - !Sub "arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${ApplicationName}-${EnvironmentName}-jobs"
      Tags:
        - Key: application
          Value: !Ref ApplicationName
        - Key: environment
          Value: !Ref EnvironmentName

  JobQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ApplicationName}-${EnvironmentName}-jobs"
      VisibilityTimeout: 900
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobDeadLetterQueue.Arn
        maxReceiveCount: 5
      Tags:
        - Key: application
          Value: !Ref ApplicationName
        - Key: environment
          Value: !Ref EnvironmentName

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/ecs/${ApplicationName}-${EnvironmentName}-api"
      RetentionInDays: !Ref LogRetentionDays

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ApplicationName}-${EnvironmentName}"
      ClusterSettings: [{ Name: containerInsights, Value: enabled }]
      Configuration:
        ExecuteCommandConfiguration: { Logging: DEFAULT }
      Tags:
        - Key: application
          Value: !Ref ApplicationName
        - Key: environment
          Value: !Ref EnvironmentName

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS ingress only for the public API load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress: []
      Tags:
        [{ Key: Name, Value: !Sub "${ApplicationName}-${EnvironmentName}-alb" }]

  LoadBalancerToApiTaskEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LoadBalancerSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref ApiContainerPort
      ToPort: !Ref ApiContainerPort
      DestinationSecurityGroupId: !Ref ApiTaskSecurityGroup

  ApiTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private API tasks accept traffic only from the ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ApiContainerPort
          ToPort: !Ref ApiContainerPort
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          DestinationSecurityGroupId: !Ref DatabaseSecurityGroup
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: !Ref VpcDnsResolverCidr
        - IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: !Ref VpcDnsResolverCidr
      Tags:
        [{ Key: Name, Value: !Sub "${ApplicationName}-${EnvironmentName}-api" }]

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL accepts traffic only from private API tasks
      VpcId: !Ref VpcId
      SecurityGroupEgress: []
      Tags:
        [
          {
            Key: Name,
            Value: !Sub "${ApplicationName}-${EnvironmentName}-postgres",
          },
        ]

  DatabaseIngressFromApiTask:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ApiTaskSecurityGroup

  ApiLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Subnets: !Ref PublicSubnetIds
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: !If [IsProduction, "true", "false"]
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
      Tags:
        - Key: application
          Value: !Ref ApplicationName
        - Key: environment
          Value: !Ref EnvironmentName

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: !Ref ApiContainerPort
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      Matcher: { HttpCode: 200-399 }
      TargetGroupAttributes:
        [{ Key: deregistration_delay.timeout_seconds, Value: "30" }]

  ApiHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApiLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates: [{ CertificateArn: !Ref AcmCertificateArn }]
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref ApiTargetGroup }]

  ApiAliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDnsRecord
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiLoadBalancer.DNSName
        HostedZoneId: !GetAtt ApiLoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: true

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the shared PostgreSQL catalog
      SubnetIds: !Ref PrivateSubnetIds
      Tags:
        - Key: application
          Value: !Ref ApplicationName
        - Key: environment
          Value: !Ref EnvironmentName

  PostgresDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${ApplicationName}-${EnvironmentName}-postgres"
      Engine: postgres
      DBName: !Ref DatabaseName
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: !Ref DatabaseAllocatedStorageGiB
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: true
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!GetAtt DatabaseSecurityGroup.GroupId]
      MasterUsername: !Ref DatabaseMasterUsername
      ManageMasterUserPassword: true
      BackupRetentionPeriod: !Ref DatabaseBackupRetentionDays
      CopyTagsToSnapshot: true
      DeletionProtection: !If [IsProduction, true, false]
      EnablePerformanceInsights: true
      MonitoringInterval: 0
      AutoMinorVersionUpgrade: true
      Tags:
        - Key: application
          Value: !Ref ApplicationName
        - Key: environment
          Value: !Ref EnvironmentName

  ApiTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationName}-${EnvironmentName}-api-execution"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadTaskStartupDependencies
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PullContainerImage
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PullContainerImageLayers
                Effect: Allow
                Action:
                  [
                    "ecr:BatchCheckLayerAvailability",
                    "ecr:GetDownloadUrlForLayer",
                    "ecr:BatchGetImage",
                  ]
                Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/*"
              - Sid: WriteContainerLogs
                Effect: Allow
                Action: ["logs:CreateLogStream", "logs:PutLogEvents"]
                Resource: !Sub "${ApiLogGroup.Arn}:*"
              - Sid: ReadInjectedSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseRuntimePasswordSecretArn
      Tags:
        - Key: application
          Value: !Ref ApplicationName
        - Key: environment
          Value: !Ref EnvironmentName

  ApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationName}-${EnvironmentName}-api-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ProjectTranscriptObjectAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListOnlyProjectAndStagingPrefixes
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt TranscriptBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: [projects/*, staging/*]
              - Sid: ReadImmutableProjectObjects
                Effect: Allow
                Action: ["s3:GetObject", "s3:GetObjectVersion"]
                Resource: !Sub "${TranscriptBucket.Arn}/projects/*"
              - Sid: WriteImmutableProjectVersions
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${TranscriptBucket.Arn}/projects/*"
              - Sid: ManageJobScopedStagingOnly
                Effect: Allow
                Action:
                  [
                    "s3:GetObject",
                    "s3:PutObject",
                    "s3:DeleteObject",
                    "s3:AbortMultipartUpload",
                    "s3:ListMultipartUploadParts",
                  ]
                Resource: !Sub "${TranscriptBucket.Arn}/staging/*"
        - PolicyName: JobQueueAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  [
                    "sqs:ChangeMessageVisibility",
                    "sqs:DeleteMessage",
                    "sqs:GetQueueAttributes",
                    "sqs:ReceiveMessage",
                    "sqs:SendMessage",
                  ]
                Resource: [!GetAtt JobQueue.Arn, !GetAtt JobDeadLetterQueue.Arn]
        - PolicyName: ServerSideTranslationOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: translate:TranslateText
                Resource: "*"
      Tags:
        - Key: application
          Value: !Ref ApplicationName
        - Key: environment
          Value: !Ref EnvironmentName

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ApplicationName}-${EnvironmentName}-api"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref ApiTaskCpu
      Memory: !Ref ApiTaskMemory
      ExecutionRoleArn: !GetAtt ApiTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApiTaskRole.Arn
      ContainerDefinitions:
        - Name: cloud-api
          Image: !Ref ApiContainerImage
          Essential: true
          PortMappings:
            [{ ContainerPort: !Ref ApiContainerPort, Protocol: tcp }]
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: CLOUD_API_HOST, Value: 0.0.0.0 }
            - { Name: CLOUD_API_PORT, Value: !Ref ApiContainerPort }
            - { Name: CLOUD_DATABASE_MODE, Value: postgres }
            - { Name: DATABASE_SSL_MODE, Value: verify-full }
            - {
                Name: DATABASE_CA_CERT_PATH,
                Value: /opt/research-video/certs/global-bundle.pem,
              }
            - { Name: CLOUD_AUTH_MODE, Value: cognito }
            - { Name: OBJECT_STORE_MODE, Value: s3 }
            - { Name: QUEUE_MODE, Value: sqs }
            - { Name: TRANSLATION_PROVIDER, Value: aws-translate }
            - {
                Name: PUBLIC_API_ORIGIN,
                Value: !Sub "https://${ApiDomainName}",
              }
            - { Name: TRANSCRIPT_BUCKET, Value: !Ref TranscriptBucket }
            - { Name: JOB_QUEUE_URL, Value: !Ref JobQueue }
            - {
                Name: DATABASE_HOST,
                Value: !GetAtt PostgresDatabase.Endpoint.Address,
              }
            - {
                Name: DATABASE_PORT,
                Value: !GetAtt PostgresDatabase.Endpoint.Port,
              }
            - { Name: DATABASE_NAME, Value: !Ref DatabaseName }
            - { Name: DATABASE_USERNAME, Value: !Ref DatabaseRuntimeUsername }
            - { Name: COGNITO_USER_POOL_ID, Value: !Ref CognitoUserPool }
            - { Name: COGNITO_CLIENT_ID, Value: !Ref CognitoUserPoolClient }
            - {
                Name: COGNITO_DOMAIN,
                Value: !Sub "https://${CognitoUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com",
              }
            - {
                Name: COGNITO_REDIRECT_URI,
                Value: research-video-clips://oauth/callback,
              }
            - {
                Name: COGNITO_LOGOUT_URI,
                Value: research-video-clips://oauth/logout,
              }
          Secrets:
            - {
                Name: DATABASE_PASSWORD,
                ValueFrom: !Ref DatabaseRuntimePasswordSecretArn,
              }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
      Tags:
        - Key: application
          Value: !Ref ApplicationName
        - Key: environment
          Value: !Ref EnvironmentName

  ApiService:
    Type: AWS::ECS::Service
    DependsOn: ApiHttpsListener
    Properties:
      ServiceName: !Sub "${ApplicationName}-${EnvironmentName}-api"
      Cluster: !Ref EcsCluster
      LaunchType: FARGATE
      DesiredCount: !Ref ApiDesiredCount
      DeploymentConfiguration:
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref ApiTaskSecurityGroup]
          Subnets: !Ref PrivateSubnetIds
      LoadBalancers:
        - ContainerName: cloud-api
          ContainerPort: !Ref ApiContainerPort
          TargetGroupArn: !Ref ApiTargetGroup
      TaskDefinition: !Ref ApiTaskDefinition
      Tags:
        - Key: application
          Value: !Ref ApplicationName
        - Key: environment
          Value: !Ref EnvironmentName

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ApplicationName}-${EnvironmentName}"
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: OPTIONAL
      UserPoolAddOns: { AdvancedSecurityMode: ENFORCED }
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      DeletionProtection: !If [IsProduction, ACTIVE, INACTIVE]
      UserPoolTags:
        { application: !Ref ApplicationName, environment: !Ref EnvironmentName }

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: desktop-public-pkce
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: ["research-video-clips://oauth/callback"]
      LogoutURLs: [!Ref CognitoLogoutUrl]
      SupportedIdentityProviders: [COGNITO]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH, ALLOW_USER_SRP_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        { AccessToken: minutes, IdToken: minutes, RefreshToken: days }

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref CognitoUserPool

  ApiUnhealthyHostAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: HTTPS target group has no healthy API tasks
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - {
            Name: LoadBalancer,
            Value: !GetAtt ApiLoadBalancer.LoadBalancerFullName,
          }
        - {
            Name: TargetGroup,
            Value: !GetAtt ApiTargetGroup.TargetGroupFullName,
          }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching
      AlarmActions: !If
        - HasAlarmTopic
        - [!Ref AlarmTopicArn]
        - !Ref AWS::NoValue

  ApiHttp5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: HTTPS load balancer returned server errors
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Dimensions:
        [
          {
            Name: LoadBalancer,
            Value: !GetAtt ApiLoadBalancer.LoadBalancerFullName,
          },
        ]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - [!Ref AlarmTopicArn]
        - !Ref AWS::NoValue

  JobQueueDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Job queue has sustained visible backlog
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt JobQueue.QueueName }]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 25
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - [!Ref AlarmTopicArn]
        - !Ref AWS::NoValue

  JobDeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A job reached the dead-letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        [{ Name: QueueName, Value: !GetAtt JobDeadLetterQueue.QueueName }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - [!Ref AlarmTopicArn]
        - !Ref AWS::NoValue

  DatabaseCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: PostgreSQL CPU is sustained above the operating threshold
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions: [{ Name: DBInstanceIdentifier, Value: !Ref PostgresDatabase }]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - [!Ref AlarmTopicArn]
        - !Ref AWS::NoValue

Outputs:
  TranscriptBucketName:
    Value: !Ref TranscriptBucket
  TranscriptBucketArn:
    Value: !GetAtt TranscriptBucket.Arn
  JobQueueUrl:
    Value: !Ref JobQueue
  JobDeadLetterQueueUrl:
    Value: !Ref JobDeadLetterQueue
  ApiLoadBalancerDnsName:
    Value: !GetAtt ApiLoadBalancer.DNSName
  ApiHttpsEndpoint:
    Value: !Sub "https://${ApiDomainName}"
  DatabaseEndpointAddress:
    Value: !GetAtt PostgresDatabase.Endpoint.Address
  DatabaseMasterSecretArn:
    Value: !GetAtt PostgresDatabase.MasterUserSecret.SecretArn
  CognitoUserPoolId:
    Value: !Ref CognitoUserPool
  CognitoUserPoolClientId:
    Value: !Ref CognitoUserPoolClient
  CognitoHostedUiDomain:
    Value: !Sub "https://${CognitoUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
